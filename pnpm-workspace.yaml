packages:
  - '.'

minimumReleaseAge: 4320

# Keep security floors within the caller's compatible major version.
# Review/remove each override when upstream and the lockfile satisfy the floor.
overrides:
  'next>sharp': '^0.35.5'
  'postcss>source-map-js': '^1.2.2'
  # Security fix for quadratic selector parsing; verify Tailwind CSS output on upgrades.
  'postcss-selector-parser': '^7.1.6'
  '@eslint/eslintrc>js-yaml': '^4.3.2'
  'postcss>nanoid': '^3.3.20'
  'browserslist': '^4.29.3'
  'baseline-browser-mapping': '^2.11.28'
  'minimatch@3>brace-expansion': '^1.1.21'
  'minimatch@10>brace-expansion': '^5.0.12'

allowBuilds:
  sharp: true
  unrs-resolver: true
