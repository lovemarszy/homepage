packages:
  - "."

minimumReleaseAge: 4320

# Next.js 16 bundles a vulnerable PostCSS release; keep its transitive dependency patched.
overrides:
  "next>postcss": ">=8.5.23"
  "next>sharp": ">=0.35.4"
  "@eslint/eslintrc>js-yaml": "^5.4.1"
  "postcss>nanoid": "^3.3.18"
  "minimatch@3>brace-expansion": "^1.1.18"
  "minimatch@10>brace-expansion": "^5.0.9"

allowBuilds:
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - ws@7.5.11
  - js-yaml@4.1.2
  - '@babel/core@7.29.1'
  # Renovate security update: nanoid@3.3.18
  - nanoid@3.3.18
