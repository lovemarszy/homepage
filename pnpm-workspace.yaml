packages:
  - '.'

minimumReleaseAge: 4320

# Keep security floors within the caller's compatible major version.
# Review/remove each override when upstream and the lockfile satisfy the floor.
overrides:
  'next>sharp': '^0.35.5'
  'postcss>source-map-js': '^1.2.4'
  # Security fix for quadratic selector parsing; verify Tailwind CSS output on upgrades.
  'postcss-selector-parser': '^7.2.1'
  '@eslint/eslintrc>js-yaml': '^4.3.2'
  'postcss>nanoid': '^3.3.20'
  'browserslist': '^4.29.6'
  'baseline-browser-mapping': '^2.11.39'
  # Security floor for ESLint's Zod 4 dependency (GHSA-mrhx-c7xc-m3w5).
  'zod@4': '^4.6.7'
  'minimatch@3>brace-expansion': '^1.1.22'
  'minimatch@10>brace-expansion': '^5.1.0'

allowBuilds:
  sharp: true
  unrs-resolver: true
